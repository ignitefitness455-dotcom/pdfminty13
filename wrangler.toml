name = "pdfminty"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace for rate-limiting and form-submission fallback storage.
# 1. Cloudflare Pages Git-based Deployment (Dashboard):
#    Go to: Workers & Pages -> Select "pdfminty" -> Settings -> Functions -> KV namespace bindings
#    Click "Add binding":
#      - Variable name: RATELIMIT_KV
#      - KV namespace: (Select your created KV namespace, e.g. "pdfminty-ratelimit")
#
# 2. Wrangler CLI Deployment:
#    The configuration below binds RATELIMIT_KV directly.
#    Replace the placeholder ID with your real KV namespace ID from Cloudflare dashboard:
#      wrangler kv:namespace create RATELIMIT_KV
#      wrangler kv:namespace create RATELIMIT_KV --preview
#
# Note: If RATELIMIT_KV is not yet configured, the application automatically falls back
# to cryptographically signed HMAC-SHA256 edge state cookies and in-memory IPv6 /64
# burst guards to prevent AI API abuse and DDoS attacks.
[[kv_namespaces]]
binding = "RATELIMIT_KV"
id = "a43016cede9e4e92bc4ee8776b952cfb"
preview_id = "a43016cede9e4e92bc4ee8776b952cfb"
