name: Record Error to GitHub Logs

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'HTTP Status Code (e.g. 400, 403, 500, 504)'
        required: true
        default: '500'
      message:
        description: 'Squeaky-clean error exception message'
        required: true
        default: 'UnhandledException: An unknown failure occurred.'
      url:
        description: 'URL, endpoint, or page path where the error occurred'
        required: false
        default: '/api/unknown'
      requests:
        description: 'Total daily requests denominator (to calculate error rates)'
        required: false
        default: '1000'
      date:
        description: 'Custom date for the log (YYYY-MM-DD format). Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  log-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Process Error Log
        env:
          INPUT_CODE: ${{ github.event.inputs.code }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_REQUESTS: ${{ github.event.inputs.requests }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            node errors/scripts/log-processor.cjs \
              --code="$INPUT_CODE" \
              --message="$INPUT_MESSAGE" \
              --url="$INPUT_URL" \
              --requests="$INPUT_REQUESTS" \
              --date="$INPUT_DATE"
          else
            node errors/scripts/log-processor.cjs \
              --code="$INPUT_CODE" \
              --message="$INPUT_MESSAGE" \
              --url="$INPUT_URL" \
              --requests="$INPUT_REQUESTS"
          fi

      - name: Commit and Push Changes
        env:
          INPUT_CODE: ${{ github.event.inputs.code }}
        run: |
          git config --global user.name 'GitHub Action Error Tracker'
          git config --global user.email 'error-tracker@github.com'
          git add errors/logs/
          
          # Check if there are changes to commit to avoid failing the workflow
          if git diff --cached --quiet; then
            echo "No new error log changes to commit."
          else
            SAFE_CODE=$(printf '%s' "$INPUT_CODE" | tr -cd '0-9')
            git commit -m "chore(telemetry): record HTTP ${SAFE_CODE:-500} error to organized logs"
            git push
          fi
