    <!-- Deferred Third-Party Scripts (Analytics) -->
    <script>
      (function() {
        var GA_ID = 'G-5WYDTKWS1J';
        var CF_TOKEN = '484669cfa7c04bb18cec08f6d0cc6e63';
        var loaded = false;

        function loadThirdPartyScripts() {
          if (loaded || window._thirdPartyLoaded) return;
          loaded = true;
          window._thirdPartyLoaded = true;

          var events = ['touchstart', 'scroll', 'pointermove', 'keydown', 'click'];
          events.forEach(function(e) {
            window.removeEventListener(e, loadThirdPartyScripts, { passive: true });
          });

          // Cloudflare Web Analytics (lightweight ~1KB, load first)
          var cf = document.createElement('script');
          cf.defer = true;
          cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          cf.setAttribute('data-cf-beacon', '{"token": "' + CF_TOKEN + '"}');
          document.body.appendChild(cf);

          // Google Tag Manager / Analytics
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(g);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', GA_ID);
        }

        var events = ['touchstart', 'scroll', 'pointermove', 'keydown', 'click'];
        events.forEach(function(e) {
          window.addEventListener(e, loadThirdPartyScripts, { passive: true, once: true });
        });

        // Reduced fallback timeout: 1000ms (was 2500ms) to capture fast bounces
        if ('requestIdleCallback' in window) {
          window.addEventListener('load', function() {
            requestIdleCallback(function() {
              setTimeout(loadThirdPartyScripts, 1000);
            });
          });
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadThirdPartyScripts, 1200);
          });
        }

        // Fallback beacon: if user leaves before gtag loads, fire a minimal
        // page_view event via navigator.sendBeacon to GA4 collect endpoint.
        // This captures fast-bounce pageviews that the delayed loader misses.
        window.addEventListener('pagehide', function() {
          if (loaded) return; // gtag already loaded — it handles this natively
          if (!navigator.sendBeacon) return;
          var cid = localStorage.getItem('_ga_cid');
          if (!cid) {
            cid = 'xxxxxxxxxxxx.xxxxxxxxxxxx'.replace(/x/g, function() {
              return Math.floor(Math.random() * 16).toString(16);
            });
            try { localStorage.setItem('_ga_cid', cid); } catch (e) {}
          }
          var payload = 'v=1&t=pageview&tid=' + GA_ID +
            '&cid=' + cid +
            '&dl=' + encodeURIComponent(location.href) +
            '&dt=' + encodeURIComponent(document.title) +
            '&dr=' + encodeURIComponent(document.referrer) +
            '&sr=' + (screen.width + 'x' + screen.height) +
            '&vp=' + (window.innerWidth + 'x' + window.innerHeight);
          navigator.sendBeacon('https://www.google-analytics.com/g/collect?' + payload);
        }, { capture: true });
      })();
    </script>

    <!-- Anti-flicker Theme Script (Defaults strictly to Light Mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference') || localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
